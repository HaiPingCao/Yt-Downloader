[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-youtube-downloader-core"
version = "0.0.1"
description = "A youtube video and music downloader using python and yt-dlp"
readme = "README.md"
requires-python = "==3.14.5"
authors = [
    {name = "HaiPingCao", email = "luongminhhai28822@gmail.com"}
]
keywords = ["youtube", "downloader", "yt-dlp", "pytube", "music", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "yt-dlp",
    "grpcio>=1.64",
    "protobuf>=5.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "grpcio-tools>=1.64",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/HaiPingCao/python-youtube-downloader-core"
Repository = "https://github.com/HaiPingCao/python-youtube-downloader-core.git"
Issues = "https://github.com/HaiPingCao/python-youtube-downloader-core/issues"

[project.scripts]
segment-grpc-server = "transport.segment_server:main"
segment-grpc-client = "transport.segment_client:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.black]
line-length = 88
target-version = ["py314"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
