<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebSocket Music Info</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Test FastAPI WebSocket /ws/music_info</h2>

    <label>Playlist URL:</label><br />
    <input
      type="text"
      id="url"
      size="60"
      placeholder="Nhập URL playlist..."
      value="http://youtube.com/playlist?list=PLKXe1HzhulvM7IuvwKMp_odaqg7VjFvJ5"
    /><br /><br />
    <label>v_start:</label>
    <input type="number" id="v_start" value="0" /><br /><br />
    <label>v_end:</label>
    <input type="number" id="v_end" value="10" /><br /><br />

    <div class="controls">
      <button id="connectBtn">🔗 Kết nối & Nhận dữ liệu</button>
      <button id="clearBtn">🧹 Clear Output</button>
    </div>

    <div id="output"></div>

    <script src="main.js"></script>
  </body>
</html>
